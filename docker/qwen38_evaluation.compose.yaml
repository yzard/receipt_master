# Temporary local evaluation, never added to playground's two-service Compose file.
name: receipt-qwen38-evaluation
services:
  backend_ocr:
    image: receipt-qwen38-evaluation:local
    init: true
    gpus: all
    devices:
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    ports: ["127.0.0.1:5001:8000"]
    volumes:
      - ../build/qwen38/models:/models:ro
    command:
      - --model
      - /models/Qwen3.8-27B-Q4_K_M.gguf
      - --mmproj
      - /models/mmproj-Qwen3.8-27B-BF16.gguf
      - --alias
      - qwen3.8-27b-q4_k_m
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --ctx-size
      - "32768"
      - --parallel
      - "1"
      - --gpu-layers
      - "99"
      - --fit
      - "off"
      - --flash-attn
      - "on"
      - --image-max-tokens
      - "4096"
      - --reasoning
      - "off"
      - --chat-template-kwargs
      - '{"enable_thinking":false}'
      - --threads
      - "8"
    networks: [evaluation]
networks:
  evaluation:
    driver: bridge
