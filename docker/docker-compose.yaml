name: receipt-master-ocr
services:
  backend_api:
    init: true
    stop_grace_period: 40s
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8000/health]
      interval: 10s
      timeout: 6s
      retries: 10
    image: receipt-master-backend-api:latest
    environment:
      - PUID=${PUID:?Set PUID to the host user ID}
      - PGID=${PGID:?Set PGID to the host group ID}
      - RESET_ADMIN_PASSWORD=${RESET_ADMIN_PASSWORD:-false}
    ports: ["0.0.0.0:5000:8000"]
    volumes:
      - ../playground/backend_api:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [ingress]
networks:
  ingress: {}
